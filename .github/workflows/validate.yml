name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Catalog check tests
        run: python3 -m unittest discover -s tests -v
      - name: Catalogs agree and point at real plugins
        run: python3 -I scripts/check-catalogs.py --remote
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Claude Code marketplace validator
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.316
          claude plugin validate .
